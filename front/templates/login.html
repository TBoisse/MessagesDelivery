{% extends "base.html" %}

{% block title %}MD - Login{% endblock %}

{% block extra_styles %}
<style>
    @import url("/static/css/user.css");
</style>
{% endblock %}

{% block extra_content %}
<div class="min-h-screen bg-[#FFF4C7] text-[#2F4858] flex items-center justify-center p-4">
    <main class="w-full max-w-md">
        <form id="login-form" class="bg-white rounded-2xl shadow-sm p-7 space-y-5">
            <h1 class="text-3xl font-semibold text-center">Connexion</h1>
            <div id="error-message"class="hidden rounded-lg border-2 border-red-400 bg-red-50 px-4 py-3 text-sm text-red-700"></div>
            <div class="space-y-1">
                <label for="form-phone" class="block text-sm font-medium">Phone number</label>
                <input id="form-phone" name="form-phone" type="tel" autocomplete="tel" class="w-full rounded-lg border border-[#B8D8BA] bg-white px-4 py-3 outline-none transition focus:border-[#006D5F] focus:ring-2 focus:ring-[#006D5F]/20" required>
            </div>
            <div class="space-y-1">
                <label for="form-password" class="block text-sm font-medium">Password</label>
                <input id="form-password" name="form-password" type="password" class="w-full rounded-lg border border-[#B8D8BA] bg-white px-4 py-3 outline-none transition focus:border-[#006D5F] focus:ring-2 focus:ring-[#006D5F]/20" required>
            </div>

            <div class="space-y-3">
                <button type="submit" class="w-full rounded-lg bg-[#006D5F] px-4 py-3 font-medium text-white transition hover:bg-[#2F4858] focus:outline-none focus:ring-2 focus:ring-[#006D5F] focus:ring-offset-2">
                    Se connecter
                </button>

                <button id="redirect-signin" type="button" class="w-full rounded-lg border border-[#006D5F] px-4 py-3 font-medium text-[#006D5F] transition hover:bg-[#B8D8BA]/30 focus:outline-none focus:ring-2 focus:ring-[#006D5F] focus:ring-offset-2">
                    S'inscrire
                </button>
            </div>
        </form>
    </main>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="/static/js/login.js"></script>
{% endblock %}
